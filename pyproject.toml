[project]
name = "sbx-extractor"
version = "0.1.0"
description = "Extract and dump relational tables from the SBX TAP service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-storage>=3.17.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyvo>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

